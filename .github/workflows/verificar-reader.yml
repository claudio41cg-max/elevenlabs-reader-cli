name: Verificar codigo Reader

on:
  push:
    branches: [desenvolvimento-reader]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Conferir sintaxe sem acessar a conta
        run: |
          python -m compileall -q elevenlabs_tts_client.py token_manager.py tools tests
      - name: Verificar ambiente sem tokens
        run: |
          python -m pip install -r requirements.txt
          python tools/verificar_ambiente.py
